# Généré depuis le catalogue du portail. À compléter au fil des spécifications.
openapi: 3.1.0
info:
  title: CEGIT – Risque inondation
  version: 0.1.0
  description: 'Exposition d''un point ou d''un bâtiment aux zones inondables et historique des événements.


    Statut : Bêta. Exemples de réponses fictifs.'
  contact:
    name: CEGIT
    url: https://cegitgroup.com/fr
    email: api@cegitgroup.com
servers:
- url: https://api.cegitgroup.com
  description: Production (cible)
- url: https://api-preprod.cegitgroup.com
  description: Préproduction
security:
- apiKey: []
tags:
- name: Risque inondation
  description: Module WALLU
paths:
  /v1/risks/flood:
    get:
      summary: Exposition d'un point
      description: Niveau d'aléa, hauteur d'eau modélisée et événements recensés.
      operationId: v1_risks_flood_get
      tags:
      - Risque inondation
      responses:
        '200':
          description: Succès
          content:
            application/json:
              example:
                point:
                - -17.39
                - 14.76
                alea: fort
                hauteur_eau_m: 0.8
                evenements_recenses: 3
                source: Modèle de démonstration
                note: Données fictives de démonstration
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      parameters:
      - name: lat
        in: query
        required: true
        description: Latitude (décimal)
        schema:
          type: number
        example: '14.7600'
      - name: lon
        in: query
        required: true
        description: Longitude (décimal)
        schema:
          type: number
        example: '-17.3900'
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
  responses:
    BadRequest:
      description: Paramètre manquant ou invalide
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Clé absente ou invalide
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Quota dépassé (voir l'en-tête Retry-After)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
