# Généré depuis le catalogue du portail. À compléter au fil des spécifications.
openapi: 3.1.0
info:
  title: CEGIT – GINDI Autocomplétion
  version: 0.1.0
  description: 'Suggestions d''adresses à la frappe pour les formulaires web et mobiles.


    Statut : Bêta. Exemples de réponses fictifs.'
  contact:
    name: CEGIT
    url: https://cegitgroup.com/fr
    email: api@cegitgroup.com
servers:
- url: https://api.cegitgroup.com
  description: Production (cible)
- url: https://api-preprod.cegitgroup.com
  description: Préproduction
security:
- apiKey: []
tags:
- name: GINDI Autocomplétion
  description: Module GINDI
paths:
  /v1/autocomplete:
    get:
      summary: Suggérer des adresses
      description: Réponse en moins de 100 ms, pensée pour un appel à chaque frappe.
      operationId: v1_autocomplete_get
      tags:
      - GINDI Autocomplétion
      responses:
        '200':
          description: Succès
          content:
            application/json:
              example:
                query: Marché Mo
                suggestions:
                - label: Marché Moussanté, Thiès
                  type: lieu
                  score: 0.91
                - label: Rue du Marché Moussanté, Thiès
                  type: rue
                  score: 0.84
                - label: Marché Moderne, Mbour
                  type: lieu
                  score: 0.62
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      parameters:
      - name: text
        in: query
        required: true
        description: Début de saisie (texte)
        schema:
          type: string
        example: Marché Mo
      - name: focus.lat
        in: query
        required: false
        description: Point de priorité (décimal)
        schema:
          type: number
        example: '14.7910'
      - name: focus.lon
        in: query
        required: false
        description: focus.lon (décimal)
        schema:
          type: number
        example: '-16.9256'
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
  responses:
    BadRequest:
      description: Paramètre manquant ou invalide
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Clé absente ou invalide
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Quota dépassé (voir l'en-tête Retry-After)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
