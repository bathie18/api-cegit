# Généré depuis portal/assets/catalog.js par tools/generer_docs.py.
openapi: 3.1.0
info:
  title: CEGIT – Saisie d'adresses Entreprise
  version: 0.2.0
  description: 'Saisie anticipée, recherche par lieu, par code et par découpage administratif pour les formulaires
    métiers.


    Statut : En spécification. Exemples de réponses fictifs.'
  contact:
    name: CEGIT
    url: https://cegitgroup.com/fr
    email: api@cegitgroup.com
servers:
- url: https://api.cegitgroup.com
  description: Production (cible)
- url: https://api-preprod.cegitgroup.com
  description: Préproduction
security:
- apiKey: []
tags:
- name: Saisie d'adresses Entreprise
  description: Module GINDI
paths:
  /v1/enterprise/typeahead:
    get:
      summary: Saisie anticipée
      description: Complète l'adresse et remplit commune, département et région.
      operationId: v1_enterprise_typeahead_get
      tags:
      - Saisie d'adresses Entreprise
      responses:
        '200':
          description: Succès
          content:
            application/json:
              example:
                query: Cité Keur Gorgui
                results:
                - label: Cité Keur Gorgui, Sicap-Liberté, Dakar
                  commune: Sicap-Liberté
                  departement: Dakar
                  region: Dakar
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      parameters:
      - name: text
        in: query
        required: true
        description: Début de saisie (texte)
        schema:
          type: string
        example: Cité Keur Gorgui
      - name: country
        in: query
        required: false
        description: Pays (code ISO)
        schema:
          type: string
        example: SN
  /v1/enterprise/by-code:
    get:
      summary: Recherche par code
      description: Code postal ou code d'adresse GINDI.
      operationId: v1_enterprise_by_code_get
      tags:
      - Saisie d'adresses Entreprise
      responses:
        '200':
          description: Succès
          content:
            application/json:
              example:
                code: '10200'
                localite: Dakar
                adresses: 124
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      parameters:
      - name: code
        in: query
        required: true
        description: Code postal ou code GINDI (texte)
        schema:
          type: string
        example: '10200'
  /v1/enterprise/by-admin:
    get:
      summary: Recherche administrative
      description: Région, département, commune, quartier et rue.
      operationId: v1_enterprise_by_admin_get
      tags:
      - Saisie d'adresses Entreprise
      responses:
        '200':
          description: Succès
          content:
            application/json:
              example:
                region: Thiès
                departement: Mbour
                commune: Saly Portudal
                resultats: 18
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      parameters:
      - name: region
        in: query
        required: true
        description: Région (texte)
        schema:
          type: string
        example: Thiès
      - name: departement
        in: query
        required: false
        description: Département (texte)
        schema:
          type: string
        example: Mbour
      - name: commune
        in: query
        required: false
        description: Commune (texte)
        schema:
          type: string
        example: Saly Portudal
      - name: rue
        in: query
        required: false
        description: Rue (texte)
        schema:
          type: string
        example: ''
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
  responses:
    BadRequest:
      description: Paramètre manquant ou invalide
      content: &id001
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Clé absente ou invalide
      content: *id001
    TooManyRequests:
      description: Quota dépassé (voir l'en-tête Retry-After)
      content: *id001
