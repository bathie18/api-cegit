# Généré depuis portal/assets/catalog.js par tools/generer_docs.py.
openapi: 3.1.0
info:
  title: CEGIT – Informations sur la propriété
  version: 0.2.0
  description: 'Attributs d''une parcelle et de son bâti : NICAD, titre, superficie, usage, valeur estimée et limites.


    Statut : En spécification. Exemples de réponses fictifs.'
  contact:
    name: CEGIT
    url: https://cegitgroup.com/fr
    email: api@cegitgroup.com
servers:
- url: https://api.cegitgroup.com
  description: Production (cible)
- url: https://api-preprod.cegitgroup.com
  description: Préproduction
security:
- apiKey: []
tags:
- name: Informations sur la propriété
  description: Modules PatriBâti et CegitCAD+
paths:
  /v1/property:
    get:
      summary: Attributs de la propriété
      description: Accès restreint aux comptes habilités.
      operationId: v1_property_get
      tags:
      - Informations sur la propriété
      responses:
        '200':
          description: Succès
          content:
            application/json:
              example:
                nicad: 0000 0000 00000 (donnée de démonstration)
                superficie_m2: 300
                usage: habitation
                note: Donnée de démonstration
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      parameters:
      - name: lat
        in: query
        required: true
        description: Latitude (décimal)
        schema:
          type: number
        example: '14.6928'
      - name: lon
        in: query
        required: true
        description: Longitude (décimal)
        schema:
          type: number
        example: '-17.4467'
  /v1/property/parcel:
    get:
      summary: Limite de la parcelle
      description: Géométrie de la parcelle.
      operationId: v1_property_parcel_get
      tags:
      - Informations sur la propriété
      responses:
        '200':
          description: Succès
          content:
            application/json:
              example:
                type: Feature
                properties:
                  nicad: 0000 0000 00000
                geometry:
                  type: Polygon
                  coordinates: '[…]'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      parameters:
      - name: nicad
        in: query
        required: true
        description: Identifiant cadastral (texte)
        schema:
          type: string
        example: 0000 0000 00000
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
  responses:
    BadRequest:
      description: Paramètre manquant ou invalide
      content: &id001
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Clé absente ou invalide
      content: *id001
    TooManyRequests:
      description: Quota dépassé (voir l'en-tête Retry-After)
      content: *id001
