# Généré depuis le catalogue du portail. À compléter au fil des spécifications.
openapi: 3.1.0
info:
  title: CEGIT – Itinéraires et isochrones
  version: 0.1.0
  description: 'Temps de parcours, itinéraires et zones accessibles en voiture, à pied ou en deux-roues.


    Statut : Bêta. Exemples de réponses fictifs.'
  contact:
    name: CEGIT
    url: https://cegitgroup.com/fr
    email: api@cegitgroup.com
servers:
- url: https://api.cegitgroup.com
  description: Production (cible)
- url: https://api-preprod.cegitgroup.com
  description: Préproduction
security:
- apiKey: []
tags:
- name: Itinéraires et isochrones
  description: Mobilité
paths:
  /v1/isochrone:
    get:
      summary: Zone accessible en N minutes
      description: Polygones d'accessibilité depuis un point, pour plusieurs durées.
      operationId: v1_isochrone_get
      tags:
      - Itinéraires et isochrones
      responses:
        '200':
          description: Succès
          content:
            application/json:
              example:
                type: FeatureCollection
                features:
                - type: Feature
                  properties:
                    minutes: 10
                    mode: auto
                    population_estimee: 90000
                  geometry:
                    type: Polygon
                    coordinates: '[…]'
                - type: Feature
                  properties:
                    minutes: 20
                    mode: auto
                    population_estimee: 360000
                  geometry:
                    type: Polygon
                    coordinates: '[…]'
                - type: Feature
                  properties:
                    minutes: 30
                    mode: auto
                    population_estimee: 810000
                  geometry:
                    type: Polygon
                    coordinates: '[…]'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      parameters:
      - name: lat
        in: query
        required: true
        description: Latitude (décimal)
        schema:
          type: number
        example: '14.7910'
      - name: lon
        in: query
        required: true
        description: Longitude (décimal)
        schema:
          type: number
        example: '-16.9256'
      - name: minutes
        in: query
        required: true
        description: Durées séparées par des virgules (liste)
        schema:
          type: string
        example: 10,20,30
      - name: mode
        in: query
        required: false
        description: auto, pedestrian, motorcycle (texte)
        schema:
          type: string
        example: auto
  /v1/route:
    post:
      summary: Calculer un itinéraire
      description: Itinéraire entre deux points ou plus, avec instructions en français.
      operationId: v1_route_post
      tags:
      - Itinéraires et isochrones
      responses:
        '200':
          description: Succès
          content:
            application/json:
              example:
                distance_km: 71.8
                duree_min: 68
                mode: auto
                etapes:
                - instruction: Prendre l'autoroute A1 vers Diamniadio
                  distance_km: 32.1
                - instruction: Continuer sur la N2 vers Thiès
                  distance_km: 37.4
                geometry:
                  type: LineString
                  coordinates: '[…]'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                from:
                  type: string
                  description: Départ
                  example: 14.6928,-17.4467
                to:
                  type: string
                  description: Arrivée
                  example: 14.7910,-16.9256
                mode:
                  type: string
                  description: auto, pedestrian
                  example: auto
              required:
              - from
              - to
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
  responses:
    BadRequest:
      description: Paramètre manquant ou invalide
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Clé absente ou invalide
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Quota dépassé (voir l'en-tête Retry-After)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
