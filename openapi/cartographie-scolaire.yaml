# Généré depuis le catalogue du portail. À compléter au fil des spécifications.
openapi: 3.1.0
info:
  title: CEGIT – Cartographie scolaire
  version: 0.1.0
  description: 'Établissements, effectifs et aires de recrutement pour la planification scolaire.


    Statut : En spécification. Exemples de réponses fictifs.'
  contact:
    name: CEGIT
    url: https://cegitgroup.com/fr
    email: api@cegitgroup.com
servers:
- url: https://api.cegitgroup.com
  description: Production (cible)
- url: https://api-preprod.cegitgroup.com
  description: Préproduction
security:
- apiKey: []
tags:
- name: Cartographie scolaire
  description: Module CartoScol
paths:
  /v1/schools:
    get:
      summary: Lister les établissements
      description: Filtrage par commune, cycle et statut.
      operationId: v1_schools_get
      tags:
      - Cartographie scolaire
      responses:
        '200':
          description: Succès
          content:
            application/json:
              example:
                commune: '01111'
                cycle: secondaire
                total: 2
                items:
                - nom: Lycée (exemple A)
                  effectif: 1240
                  statut: public
                - nom: Lycée (exemple B)
                  effectif: 860
                  statut: privé
                note: Données fictives de démonstration
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      parameters:
      - name: commune
        in: query
        required: true
        description: Code commune (code)
        schema:
          type: string
        example: '01111'
      - name: cycle
        in: query
        required: false
        description: elementaire, moyen, secondaire (texte)
        schema:
          type: string
        example: secondaire
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
  responses:
    BadRequest:
      description: Paramètre manquant ou invalide
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Clé absente ou invalide
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Quota dépassé (voir l'en-tête Retry-After)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
