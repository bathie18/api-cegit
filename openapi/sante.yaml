# Généré depuis portal/assets/catalog.js par tools/generer_docs.py.
openapi: 3.1.0
info:
  title: CEGIT – Santé
  version: 0.2.0
  description: 'Hôpitaux, centres et postes de santé, pharmacies : structures les plus proches et temps d''accès.


    Statut : Bêta. Exemples de réponses fictifs.'
  contact:
    name: CEGIT
    url: https://cegitgroup.com/fr
    email: api@cegitgroup.com
servers:
- url: https://api.cegitgroup.com
  description: Production (cible)
- url: https://api-preprod.cegitgroup.com
  description: Préproduction
security:
- apiKey: []
tags:
- name: Santé
  description: Module C-Health
paths:
  /v1/health/facilities/nearby:
    get:
      summary: Structures les plus proches
      description: Classées par temps d'accès réel.
      operationId: v1_health_facilities_nearby_get
      tags:
      - Santé
      responses:
        '200':
          description: Succès
          content:
            application/json:
              example:
                items:
                - nom: Hôpital régional de Thiès
                  type: hôpital
                  acces_min: 6
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      parameters:
      - name: lat
        in: query
        required: true
        description: Latitude (décimal)
        schema:
          type: number
        example: '14.791'
      - name: lon
        in: query
        required: true
        description: Longitude (décimal)
        schema:
          type: number
        example: '-16.9256'
      - name: type
        in: query
        required: false
        description: hopital, centre, poste, pharmacie (texte)
        schema:
          type: string
        example: hopital
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
  responses:
    BadRequest:
      description: Paramètre manquant ou invalide
      content: &id001
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Clé absente ou invalide
      content: *id001
    TooManyRequests:
      description: Quota dépassé (voir l'en-tête Retry-After)
      content: *id001
