# Généré depuis le catalogue du portail. À compléter au fil des spécifications.
openapi: 3.1.0
info:
  title: CEGIT – Biodiversité
  version: 0.1.0
  description: 'Observations de faune et de flore, référentiel taxonomique et sensibilité des espèces.


    Statut : En spécification. Exemples de réponses fictifs.'
  contact:
    name: CEGIT
    url: https://cegitgroup.com/fr
    email: api@cegitgroup.com
servers:
- url: https://api.cegitgroup.com
  description: Production (cible)
- url: https://api-preprod.cegitgroup.com
  description: Préproduction
security:
- apiKey: []
tags:
- name: Biodiversité
  description: Module NaturaSen
paths:
  /v1/taxa/occurrences:
    get:
      summary: Observations dans une emprise
      description: Les espèces sensibles sont floutées à la maille.
      operationId: v1_taxa_occurrences_get
      tags:
      - Biodiversité
      responses:
        '200':
          description: Succès
          content:
            application/json:
              example:
                bbox: -17.2,14.6,-16.8,14.9
                total: 2
                items:
                - taxon: Adansonia digitata
                  observations: 42
                - taxon: Balearica pavonina
                  observations: 5
                  floute: true
                note: Données fictives de démonstration
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      parameters:
      - name: bbox
        in: query
        required: true
        description: ouest,sud,est,nord (4 décimaux)
        schema:
          type: string
        example: -17.2,14.6,-16.8,14.9
      - name: taxon
        in: query
        required: false
        description: Nom scientifique (texte)
        schema:
          type: string
        example: ''
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
  responses:
    BadRequest:
      description: Paramètre manquant ou invalide
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Clé absente ou invalide
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Quota dépassé (voir l'en-tête Retry-After)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
