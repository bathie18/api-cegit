# Généré depuis portal/assets/catalog.js par tools/generer_docs.py.
openapi: 3.1.0
info:
  title: CEGIT – Géocodage
  version: 0.2.0
  description: 'Convertissez une adresse, un lieu-dit ou un repère en coordonnées, et inversement.


    Statut : Prototype. Exemples de réponses fictifs.'
  contact:
    name: CEGIT
    url: https://cegitgroup.com/fr
    email: api@cegitgroup.com
servers:
- url: https://api.cegitgroup.com
  description: Production (cible)
- url: https://api-preprod.cegitgroup.com
  description: Préproduction
security:
- apiKey: []
tags:
- name: Géocodage
  description: Module GINDI
paths:
  /v1/geocode:
    get:
      summary: Géocodage direct
      description: Renvoie les candidats classés par score de confiance.
      operationId: v1_geocode_get
      tags:
      - Géocodage
      responses:
        '200':
          description: Succès
          content:
            application/json:
              example:
                type: FeatureCollection
                query: Avenue Léopold Sédar Senghor, Thiès
                features:
                - type: Feature
                  geometry:
                    type: Point
                    coordinates:
                    - -16.9256
                    - 14.791
                  properties:
                    label: Avenue Léopold Sédar Senghor, Thiès
                    commune: Thiès-Nord
                    departement: Thiès
                    region: Thiès
                    precision: rue
                    score: 0.94
                    gindi_code: TH-N-0412
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      parameters:
      - name: q
        in: query
        required: true
        description: Adresse, lieu-dit ou repère (texte)
        schema:
          type: string
        example: Avenue Léopold Sédar Senghor, Thiès
      - name: country
        in: query
        required: false
        description: Pays de recherche (code ISO)
        schema:
          type: string
        example: SN
      - name: limit
        in: query
        required: false
        description: Nombre de résultats (1 à 20) (entier)
        schema:
          type: integer
        example: '3'
  /v1/reverse:
    get:
      summary: Géocodage inverse
      description: Renvoie l'adresse la plus proche d'un point.
      operationId: v1_reverse_get
      tags:
      - Géocodage
      responses:
        '200':
          description: Succès
          content:
            application/json:
              example:
                type: Feature
                geometry:
                  type: Point
                  coordinates:
                  - -16.9256
                  - 14.791
                properties:
                  label: Avenue Léopold Sédar Senghor, Thiès
                  distance_m: 18
                  commune: Thiès-Nord
                  gindi_code: TH-N-0412
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      parameters:
      - name: lat
        in: query
        required: true
        description: Latitude WGS 84 (décimal)
        schema:
          type: number
        example: '14.791'
      - name: lon
        in: query
        required: true
        description: Longitude WGS 84 (décimal)
        schema:
          type: number
        example: '-16.9256'
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
  responses:
    BadRequest:
      description: Paramètre manquant ou invalide
      content: &id001
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Clé absente ou invalide
      content: *id001
    TooManyRequests:
      description: Quota dépassé (voir l'en-tête Retry-After)
      content: *id001
